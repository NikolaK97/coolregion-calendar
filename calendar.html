<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalendář akcí Coolregion</title>

  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      background: #ffffff;
      color: #1f2937;
    }

    /* Wrapper se přizpůsobí přesně obsahu (kalendář + případně detail) */
    #app {
      max-width: 1200px;
      margin: 0 auto;
    }

    #calendar {
      /* žádné min-height – kalendář má přesně tolik místa, kolik potřebuje */
    }

    .fc .fc-toolbar-title {
      font-size: 28px;
      font-weight: 700;
    }

    .fc .fc-button {
      border-radius: 8px;
      border: none;
      padding: 8px 14px;
    }

    .fc-event {
      cursor: pointer;
      border: none !important;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 13px;
    }

    .fc-event:hover {
      opacity: 0.9;
    }

    #event-detail {
      margin: 24px 0 0 0;
      padding: 28px;
      border-radius: 16px;
      background: #f8fafc;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: none;
    }

    #detail-title {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 28px;
      line-height: 1.2;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .detail-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
    }

    .detail-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 16px;
      line-height: 1.5;
    }

    #detail-description {
      line-height: 1.7;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    /* Řádek s tlačítky: Detail akce vlevo, Zavřít vpravo */
    .detail-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #detail-link {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    #detail-link:hover {
      opacity: 0.92;
    }

    #detail-close {
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1f2937;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    #detail-close:hover {
      background: #f1f5f9;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .fc .fc-toolbar {
        flex-direction: column;
        gap: 10px;
      }

      #detail-title {
        font-size: 22px;
      }

      .detail-actions {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      #detail-link,
      #detail-close {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="calendar"></div>

    <div id="event-detail">

      <h2 id="detail-title"></h2>

      <div class="detail-grid">

        <div class="detail-card">
          <div class="detail-label">Místo</div>
          <div class="detail-value" id="detail-location"></div>
        </div>

        <div class="detail-card">
          <div class="detail-label">Téma</div>
          <div class="detail-value" id="detail-theme"></div>
        </div>

        <div class="detail-card">
          <div class="detail-label">Pořádá</div>
          <div class="detail-value" id="detail-organizer"></div>
        </div>

      </div>

      <div id="detail-description"></div>

      <div class="detail-actions">
        <a
          id="detail-link"
          href="#"
          target="_blank"
        >
          Detail akce
        </a>

        <button id="detail-close" type="button">
          Zavřít
        </button>
      </div>

    </div>

  </div>

  <script>

    const SHEET_URL =
      "https://opensheet.elk.sh/1ZufO1oT58PzJsBwWcVyt-lnjlgUg8DuJ-MyHpMfHq7Q/Akce";

    function containsCoolregion(value) {
      return String(value || "")
        .toLowerCase()
        .includes("coolregion");
    }

    function parseCzechDate(value) {

      if (!value) return null;

      const clean = String(value)
        .trim()
        .replace(/\s+/g, " ")
        .replace(/[–—]/g, "-");

      const parts =
        clean.split("-")
          .map(part => part.trim());

      function extractDate(text, fallbackMonth, fallbackYear) {

        const nums = text.match(/\d+/g);

        if (!nums) return null;

        let day = nums[0];
        let month = nums[1] || fallbackMonth;
        let year = nums[2] || fallbackYear;

        if (!day || !month || !year) return null;

        return { day, month, year };
      }

      function toIsoDate(day, month, year) {
        return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function addOneDay(isoDate) {
        const date = new Date(isoDate + "T00:00:00");
        date.setDate(date.getDate() + 1);
        return date.toISOString().split("T")[0];
      }

      if (parts.length === 1) {

        const d = extractDate(parts[0]);

        if (!d) return null;

        return {
          start: toIsoDate(d.day, d.month, d.year),
          end: null
        };
      }

      if (parts.length >= 2) {

        const end = extractDate(parts[1]);

        if (!end) return null;

        const start = extractDate(parts[0], end.month, end.year);

        if (!start) return null;

        const startIso = toIsoDate(start.day, start.month, start.year);
        const endIso = toIsoDate(end.day, end.month, end.year);

        return {
          start: startIso,
          end: addOneDay(endIso)
        };
      }

      return null;
    }

    async function loadEvents() {

      const response = await fetch(SHEET_URL);
      const data = await response.json();

      return data

        .filter(row => containsCoolregion(row["Kde"]))

        .map(row => {

          const parsedDate = parseCzechDate(row["Termín"]);

          if (!parsedDate) return null;

          return {
            title: row["Akce"] || row["Téma"] || "Akce",
            start: parsedDate.start,
            end: parsedDate.end,
            url: row["Odkaz"] || "",
            extendedProps: {
              misto: row["Místo"] || "",
              tema: row["Téma"] || "",
              popis: row["Popis akce"] || "",
              poradatel: row["Pořádá"] || ""
            }
          };
        })

        .filter(Boolean);
    }

    document.addEventListener("DOMContentLoaded", async function () {

      const detailBox = document.getElementById("event-detail");
      const calendarEl = document.getElementById("calendar");

      // Tlačítko Zavřít – skryje detail a vrátí zpět ke kalendáři
      document.getElementById("detail-close")
        .addEventListener("click", function () {
          detailBox.style.display = "none";
          calendarEl.scrollIntoView({ behavior: "smooth" });
        });

      try {

        const events = await loadEvents();

        const calendar = new FullCalendar.Calendar(calendarEl, {

          initialView: "dayGridMonth",
          locale: "cs",
          firstDay: 1,
          height: "auto",

          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,listMonth"
          },

          buttonText: {
            today: "Dnes",
            month: "Měsíc",
            list: "Seznam"
          },

          events: events,

          eventClick: function (info) {

            info.jsEvent.preventDefault();

            const event = info.event;
            const props = event.extendedProps;

            detailBox.style.display = "block";

            document.getElementById("detail-title").innerText = event.title;
            document.getElementById("detail-location").innerText = props.misto || "-";
            document.getElementById("detail-theme").innerText = props.tema || "-";
            document.getElementById("detail-organizer").innerText = props.poradatel || "-";
            document.getElementById("detail-description").innerText = props.popis || "";

            const detailLink = document.getElementById("detail-link");

            if (event.url) {
              detailLink.href = event.url;
              detailLink.style.display = "inline-block";
            } else {
              detailLink.style.display = "none";
            }

            detailBox.scrollIntoView({ behavior: "smooth" });
          }
        });

        calendar.render();

      } catch (error) {

        calendarEl.innerHTML =
          '<div style="color:red;text-align:center;margin-top:40px;">' +
          'Kalendář se nepodařilo načíst.</div>';

        console.error(error);
      }
    });

  </script>

</body>
</html>
