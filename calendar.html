<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />

  <title>Kalendář akcí</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #calendar {
      max-width: 1200px;
      margin: auto;
    }

  </style>

</head>

<body>

<div id="calendar"></div>

<script>

async function loadEvents() {

  const response = await fetch(
    'https://opensheet.elk.sh/1zi-FUGYSLdyz1jk0gom-_G0y_jX2BLk-L1VJbXajIcM/List%201'
  );

  const data = await response.json();

  return data.map(row => ({

    title: decodeURIComponent(escape(row.nazev)),
    start: row.datum,

    extendedProps: {
      location: decodeURIComponent(escape(row.lokace)),
      description: decodeURIComponent(escape(row.popisek))
    }

  }));

}

document.addEventListener('DOMContentLoaded', async function () {

  const events = await loadEvents();

  const calendarEl = document.getElementById('calendar');

  const calendar = new FullCalendar.Calendar(calendarEl, {

    locale: 'cs',

    initialView: 'dayGridMonth',

    height: 'auto',

    events: events,

    eventClick: function(info) {

      window.open(
        info.event.extendedProps.description,
        '_blank'
      );

    }

  });

  calendar.render();

});

</script>

</body>
</html>
