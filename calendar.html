<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Kalendář akcí Coolregion</title>

  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
      color: #1f2937;
    }

    #calendar {
      max-width: 1200px;
      margin: auto;
      min-height: 700px;
    }

    .fc .fc-toolbar-title {
      font-size: 28px;
      font-weight: 700;
    }

    .fc .fc-button {
      border-radius: 8px;
      border: none;
      padding: 8px 14px;
    }

    .fc-event {
      cursor: pointer;
      border: none !important;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 13px;
    }

    .fc-event:hover {
      opacity: 0.9;
    }

    #event-detail {

      max-width: 1200px;
      margin: 30px auto;
      padding: 28px;

      border-radius: 16px;

      background: #f8fafc;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.08);

      display: none;
    }

    #detail-title {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 28px;
      line-height: 1.2;
    }

    .detail-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .detail-card {

      background: white;

      padding: 16px;

      border-radius: 12px;
    }

    .detail-label {

      font-size: 13px;

      font-weight: 700;

      text-transform: uppercase;

      color: #64748b;

      margin-bottom: 6px;
    }

    .detail-value {

      font-size: 16px;

      line-height: 1.5;
    }

    #detail-description {

      line-height: 1.7;

      margin-bottom: 24px;

      white-space: pre-line;
    }

    #detail-link {

      display: inline-block;

      padding: 12px 20px;

      border-radius: 10px;

      background: #1d4ed8;

      color: white;

      text-decoration: none;

      font-weight: 600;
    }

    #detail-link:hover {
      opacity: 0.92;
    }

    @media (max-width: 768px) {

      body {
        margin: 10px;
      }

      .fc .fc-toolbar {
        flex-direction: column;
        gap: 10px;
      }

      #detail-title {
        font-size: 22px;
      }

    }

  </style>
</head>

<body>

  <div id="calendar"></div>

  <div id="event-detail">

    <h2 id="detail-title"></h2>

    <div class="detail-grid">

      <div class="detail-card">
        <div class="detail-label">Místo</div>
        <div class="detail-value" id="detail-location"></div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Téma</div>
        <div class="detail-value" id="detail-theme"></div>
      </div>

      <div class="detail-card">
        <div class="detail-label">Pořádá</div>
        <div class="detail-value" id="detail-organizer"></div>
      </div>

    </div>

    <div id="detail-description"></div>

    <a
      id="detail-link"
      href="#"
      target="_blank"
    >
      Detail akce
    </a>

  </div>

</body>
</html>
